name: COBOL Compile Pipeline

on: push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Leggi config YAML
        run: |
          echo "========================================="
          echo "📦 LETTURA CONFIG BUILD"
          echo "========================================="
          cat config/build.yml

      - name: Verifica sorgente COBOL
        run: |
          echo "========================================="
          echo "🔍 SORGENTI DA COMPILARE"
          echo "========================================="
          ls -la src/
          echo ""
          echo "--- Contenuto HELLO.cbl ---"
          cat src/Hello.cbl

      - name: Simula compilazione COBOL
        run: |
          echo "⚙️  COMPILAZIONE IN CORSO..."
          FILE="src/Hello.cbl"
          if ! grep -q "PROGRAM-ID" "$FILE"; then
            echo "❌ ERRORE: PROGRAM-ID mancante in $FILE"
            exit 1
          fi
          if ! grep -q "STOP RUN" "$FILE"; then
            echo "❌ ERRORE: STOP RUN mancante in $FILE"
            exit 1
          fi
          echo "✅ COMPILAZIONE OK"

      - name: Simula deploy
        run: |
          echo "========================================="
          echo "🚀 DEPLOY"
          echo "========================================="
          echo "Programma HELLO deployato in TEST"
          echo "========================================="
